<text x="245" y="525" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#142333" dominant-baseline="text-before-edge" text-anchor="middle">Tailscale + SSH 客户端</text>
<text x="245" y="566" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#516274" dominant-baseline="text-before-edge" text-anchor="middle">UU：人工远程协助</text>
