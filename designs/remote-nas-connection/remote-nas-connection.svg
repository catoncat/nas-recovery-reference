<text x="1325" y="357" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="600" fill="#142333" dominant-baseline="text-before-edge" text-anchor="middle">一根网线直连</text>
<line x1="1197" y1="438" x2="1452" y2="438" stroke="#1baf7a" stroke-width="7"/>
