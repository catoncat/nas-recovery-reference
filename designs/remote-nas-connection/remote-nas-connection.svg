<text x="1291" y="792" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="600" fill="#142333" dominant-baseline="text-before-edge" text-anchor="start">Codex 通过 SSH 工作</text>
<text x="1291" y="837" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#516274" dominant-baseline="text-before-edge" text-anchor="start">识别进程、保全取钥、推进恢复</text>
<rect x="70" y="909" width="1670" height="89" rx="14" fill="#f4f7fa"/>
<text x="94" y="929" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#142333" dominant-baseline="text-before-edge" text-anchor="start">接线要点：NAS 仅连这台笔记本；笔记本不启用网桥、Internet 共享或子网路由。</text>
<text x="94" y="966" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#516274" dominant-baseline="text-before-edge" text-anchor="start">笔记本的直连网口不设默认网关 / DNS；不要为远程救援把 NAS 接回公网或业务网络。</text>
<text x="72" y="1031" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="22" font-weight="400" fill="#516274" dominant-baseline="text-before-edge" text-anchor="start">操作参考  github.com/catoncat/nas-recovery-reference</text>
