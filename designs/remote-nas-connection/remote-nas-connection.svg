<text x="955" y="552" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="400" fill="#142333" dominant-baseline="text-before-edge" text-anchor="middle">Tailscale + OpenSSH 服务 + UU</text>
<text x="955" y="595" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="25" font-weight="400" fill="#516274" dominant-baseline="text-before-edge" text-anchor="middle">网口或 USB 转网口 → NAS</text>
<text x="1605" y="471" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="33" font-weight="600" fill="#142333" dominant-baseline="text-before-edge" text-anchor="middle">客户 NAS</text>
<text x="1605" y="525" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="26" font-weight="400" fill="#142333" dominant-baseline="text-before-edge" text-anchor="middle">保持供电</text>
