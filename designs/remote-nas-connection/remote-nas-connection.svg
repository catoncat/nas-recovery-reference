<text x="70" y="54" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="52" font-weight="600" fill="#142333" dominant-baseline="text-before-edge" text-anchor="start">不去现场，如何远程接入客户 NAS</text>
<text x="73" y="128" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="400" fill="#516274" dominant-baseline="text-before-edge" text-anchor="start">一台客户技术笔记本作跳板：上网走 Wi-Fi / 手机热点，NAS 走独立网线。</text>
