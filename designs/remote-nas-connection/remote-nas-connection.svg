<text x="711" y="792" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="28" font-weight="600" fill="#142333" dominant-baseline="text-before-edge" text-anchor="start">UU 人工协助（需要时）</text>
<text x="711" y="837" font-family="STHeiti, PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="400" fill="#516274" dominant-baseline="text-before-edge" text-anchor="start">首次配置、确认桌面、处理卡点</text>
